name: Check app
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: python -m pip install --only-binary=:all: -r requirements-app.txt
      - run: python -m unittest discover -s tests
      - run: python tools/check_public_tree.py
      - run: git diff --check

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: munai:check
      - name: Offline image smoke check (no camera or broker)
        run: >-
          docker run --rm --network none --entrypoint python munai:check
          -c "import cv2, numpy, PIL, paho.mqtt.client;
          from ha_service.options import validate;
          assert not validate({})['capture_enabled']"
